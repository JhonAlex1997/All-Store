# Perfil de pruebas automáticas: base propia, separada de la de desarrollo, para que una prueba
# nunca deje ni borre datos con los que trabajas. Usuario y contraseña se toman del .env (o de
# las variables de entorno en CI).
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/allstore_test}

# Clave fija solo para las pruebas automáticas (no se usa en ningún otro entorno).
app.seguridad.jwt-secret=clave-de-pruebas-automaticas-allstore-no-usar-en-produccion
