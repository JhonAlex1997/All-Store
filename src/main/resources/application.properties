spring.application.name=all-store

# Variables locales (credenciales de BD, etc.) desde un archivo .env en la raíz del proyecto,
# que no se sube a git. Copia .env.example a .env y completa los valores.
spring.config.import=optional:file:.env[.properties]

# --- Base de datos ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/allstore}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}


# El esquema lo gestiona Flyway (src/main/resources/db/migration); Hibernate solo valida
# que las entidades coincidan con las tablas, nunca las crea ni altera.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Servidor ---
server.port=${SERVER_PORT:8080}
spring.web.error.include-stacktrace=never

# --- Seguridad ---
# Clave para firmar los tokens de sesión (JWT). Obligatoria, aleatoria, mínimo 32 caracteres.
app.seguridad.jwt-secret=${JWT_SECRET:}
# Duración de la sesión (8 horas = una jornada).
app.seguridad.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:480}
# Orígenes del frontend autorizados a llamar a la API (separados por coma).
app.seguridad.cors-origenes=${CORS_ORIGENES:http://localhost:4200}
# Contraseña del primer administrador. Vacía = se genera una y se muestra una vez en el log.
# Intentos fallidos de ingreso tolerados por IP en la ventana (password spraying). Detrás de un proxy
# inverso (Nginx, balanceador), activa server.forward-headers-strategy=native para ver la IP real.
app.seguridad.intentos-login-por-ip=${LOGIN_INTENTOS_POR_IP:20}
app.seguridad.ventana-login-minutos=${LOGIN_VENTANA_MINUTOS:15}
# Tamaño máximo del cuerpo de una solicitud (KB).
app.seguridad.maximo-cuerpo-kb=${MAXIMO_CUERPO_KB:1024}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
# Ningún listado devuelve más de 200 filas por página (el valor por defecto de Spring es 2000).
spring.data.web.pageable.max-page-size=200
app.seguridad.admin-inicial-password=${ADMIN_PASSWORD_INICIAL:}

# --- Facturación electrónica SUNAT ---
# Envío directo a SUNAT. Usuario SOL, clave y certificado son secretos: van en variables de entorno.
app.sunat.habilitado=${SUNAT_HABILITADO:false}
app.sunat.entorno=${SUNAT_ENTORNO:BETA}
app.sunat.usuario-sol=${SUNAT_USUARIO_SOL:}
app.sunat.clave-sol=${SUNAT_CLAVE_SOL:}
app.sunat.certificado-ruta=${SUNAT_CERTIFICADO_RUTA:}
app.sunat.certificado-clave=${SUNAT_CERTIFICADO_CLAVE:}
# Guía de remisión: va por la API REST de SUNAT, con credenciales propias que se generan en el menú
# SOL (Empresas > Credenciales de API SUNAT). SUNAT no tiene entorno de pruebas para la guía vigente.
app.sunat.gre.client-id=${SUNAT_GRE_CLIENT_ID:}
app.sunat.gre.client-secret=${SUNAT_GRE_CLIENT_SECRET:}

# --- Entrega del comprobante al cliente (enlace de descarga y correo) ---
# Dirección pública del sistema: con ella se arman los enlaces que recibe el cliente.
app.entrega.url-publica=${URL_PUBLICA:http://localhost:8080}
# DESACTIVADO, SMTP o ARCHIVO (desarrollo). Con SMTP, el servidor de correo va en las variables
# estándar SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME y SPRING_MAIL_PASSWORD.
app.entrega.correo.modo=${CORREO_MODO:DESACTIVADO}
# Dirección "De:"; con SMTP suele tener que ser la misma cuenta que envía. Vacía = correo de la empresa.
app.entrega.correo.remitente=${CORREO_REMITENTE:}
# Enviar el comprobante al correo del cliente apenas SUNAT lo acepta.
app.entrega.correo.envio-automatico=${CORREO_ENVIO_AUTOMATICO:true}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Sin STARTTLS no se envía: un intermediario no puede forzar la conexión sin cifrar y leer la clave SMTP.
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000
# --- WhatsApp (API oficial de Meta, WhatsApp Cloud API) ---
# Sin token ni número la caja comparte el enlace wa.me y envía el mensaje a mano. Ver WhatsappProperties
# para la plantilla que hay que aprobar en Meta (encabezado DOCUMENTO y 4 variables en el cuerpo).
app.whatsapp.token=${WHATSAPP_TOKEN:}
app.whatsapp.numero-id=${WHATSAPP_NUMERO_ID:}
app.whatsapp.plantilla=${WHATSAPP_PLANTILLA:comprobante_electronico}
app.whatsapp.idioma=${WHATSAPP_IDIOMA:es}

# --- Consulta de RUC y DNI para llenar los datos del cliente ---
# DESACTIVADO (se escriben a mano) o DECOLECTA (proveedor de pago: https://decolecta.com, el número
# consultado se envía a ese proveedor). El token es secreto.
app.consulta-documentos.proveedor=${CONSULTA_DOCUMENTOS_PROVEEDOR:DESACTIVADO}
app.consulta-documentos.token=${CONSULTA_DOCUMENTOS_TOKEN:}

# Un servidor de correo caído no debe marcar la aplicación como caída.
management.health.mail.enabled=false

# --- Alertas para el administrador (comprobantes rechazados, plazos de SUNAT, certificado) ---
# A quiénes llega el resumen por correo, separados por coma. Vacío = correo de la empresa.
app.alertas.correos=${ALERTAS_CORREOS:}
# Cuándo (cron, hora de Lima): por defecto a las 8:00 y a las 18:00.
app.alertas.horario=${ALERTAS_HORARIO:0 0 8,18 * * *}
# Días calendario que da SUNAT para recibir un comprobante (3 en facturas y notas; se usa para todos).
app.alertas.dias-plazo-envio=${ALERTAS_DIAS_PLAZO_ENVIO:3}

# --- Actuator: solo health expuesto ---
management.endpoints.web.exposure.include=health

# --- Swagger (documentación y pruebas de la API) ---
# Apagado por defecto: en producción no se publica el mapa completo de la API. El perfil "dev"
# lo enciende (application-dev.properties).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
