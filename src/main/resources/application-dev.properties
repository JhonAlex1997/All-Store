# Perfil de desarrollo: se activa con spring.profiles.active=dev (en el .env local).
# Nunca se usa en producción.

# Swagger para explorar y probar la API desde el navegador.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Carga datos de demostración (empresa ficticia, series, productos, clientes) la primera vez
# que arranca sobre una base vacía. Ver DatosDemoLoader.
app.demo.cargar-datos=true
# SUNAT en entorno BETA (pruebas, sin validez tributaria). MODDATOS / moddatos son las credenciales
# públicas que SUNAT publica para beta y el certificado es uno autofirmado solo para pruebas.
app.sunat.habilitado=true
app.sunat.entorno=BETA
app.sunat.usuario-sol=MODDATOS
app.sunat.clave-sol=moddatos
app.sunat.certificado-ruta=config/sunat/certificado-beta-prueba.p12
app.sunat.certificado-clave=prueba-beta

# Contraseña de prueba de los usuarios demo (admin, cajero, almacenero). Solo existe en dev.
app.demo.password=Demo2026allstore
