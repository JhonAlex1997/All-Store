# Perfil de desarrollo: se activa con spring.profiles.active=dev (en el .env local).
# Nunca se usa en producción.

# Swagger para explorar y probar la API desde el navegador.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Carga datos de demostración (empresa ficticia, series, productos, clientes) la primera vez
# que arranca sobre una base vacía. Ver DatosDemoLoader.
app.demo.cargar-datos=true
